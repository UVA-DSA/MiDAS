<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Collection System</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.css" integrity="sha512-KXol4x3sVoO+8ZsWPFI/r5KBVB/ssCGB5tsv2nVOKwLg33wTFP3fmnXa47FdSVIshVTgsYk/1734xSk9aFIa4A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.js" integrity="sha512-Xo0Jh8MsOn72LGV8kU5LsclG7SUzJsWGhXbWcYs2MAmChkQzwiW/yTQwdJ8w6UA9C6EVG18GHb/TrYpYCjyAQw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <div class="ui horizontal segments">
        <div class="ui segment">
            <div class="ui form">
                <div class="fields">
                    <div class="field">
                        <label>Subject</label>
                        <input type="text" placeholder="Subject Name" required id="subject">
                    </div>
                    <div class="field">
                        <label>Trial</label>
                        <input type="text" placeholder="Trial Number" required id="trial">
                    </div>
                </div>
                <div class="fields">
                    <div class="field">
                        <label>Task</label>
                        <input type="text" placeholder="Enter Task" required id="task">
                    </div>
                    <div class="field">
                        <label>Rate</label>
                        <input type="number" id="rate" name="inputNumber" min="12" max="255" required value="90">
                    </div>
                </div>
        
                <br>
                <br>
                <button class="ui button" type="submit" onclick="sendData();">Start</button>
                <button class="ui button" type="submit" onclick="endProgram();">End</button>
            </div>
        </div>
        <div class="ui segment">
            <div class="ui card">
                <div class="content">
                  <div class="header">Guideline</div>
                </div>
                <div class="content">
                    <p id="sample">
                        <b>Do not use spaces, “.”, “/”, or  whitespaces in any of the inputs.</b>
                    </p>
                    <p>
                        <b>Subject:</b>Person using the system
                    </p>
                    <p>
                        <b>Task:</b>Type of exercise beign recorded
                    </p>
                    <p>
                        <b>Rate:</b>Frequency(Hz) as a float value of MIDAS sampling rate
                    </p>
                </div>
        
            </div>
        </div>
    </div>
    <script src="main.js"></script>
    <script type="text/javascript" src="../eel.js"></script>
</body>
</html>
