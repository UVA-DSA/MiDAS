paths:
  desk_root: "./DESK"
  output_root: "./desk_outputs"
  frames_dir: "${paths.output_root}/frames"
  index_csv: "${paths.output_root}/index.csv"
  logs_dir: "${paths.output_root}/logs"
  ckpt_dir: "${paths.output_root}/checkpoints"

preprocess:
  overwrite: false
  target_fps: 10
  jpeg_quality: 90
  num_workers: 0

dataset:
  image_size: 224
  center_crop: false
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augment:
    random_resized_crop_scale: [0.8, 1.0]
    horizontal_flip_prob: 0.5
    color_jitter: [0.2, 0.2, 0.2, 0.1]
    # Additional brightness/contrast augmentation (applied with 50% probability)
    extra_brightness_contrast: [0.3, 0.3]  # brightness, contrast

split:
  train_size: 0.7
  val_size: 0.15
  test_size: 0.15
  random_state: 42
  stratify_by: "label"

training:
  seed: 1337
  device: "cuda"
  num_classes: 7
  epochs: 40
  batch_size: 32
  num_workers: 4
  pin_memory: true
  amp: true
  grad_accum_steps: 1

optim:
  name: "adamw"
  lr: 0.0005
  weight_decay: 0.1
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: "cosine"
  warmup_epochs: 3
  min_lr: 1.0e-6

checkpoint:
  interval_epochs: 1
  best_metric: "val_f1_macro"
  maximize: true
  keep_all: true  # Keep all checkpoints, don't delete any
  resume: false

early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.0005
  monitor: "val_f1_macro"  # Monitor validation metric

logging:
  step_log_interval: 50
  save_confusion_matrix: true
  confusion_matrix_format: "png"
  csv_log: true
