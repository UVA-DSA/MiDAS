record_results: true

dataloader_params:
  experiment_name: "hamid_resnet_DS_NOCLUTCH_NOWINDOW_only"
  base_path: "/standard/UVA-DSA/MIDAS/Organized/final_data/"
  batch_size: 4
  sample_rate: 10
  ignore_clutch: true
  clutch_pressed_value: 0
  all_trials: ["t1","t3","t4","t5","t6","t7"]

  cv:
    scheme: "gesture_flat"
    k: 5
    val_ratio: 0.25
    seed: 42
    shuffle: true
    val_same_as_test: true


  modalities: ["console"]

  selections:
    console: [
      "console_pos0","console_pos1","console_pos2","console_pos3","console_pos4","console_pos5",
      "console_rot0","console_rot1","console_rot2","console_rot3","console_rot4","console_rot5",
      "console_aux0","console_aux1","console_pedal"
    ]
    # images: ["resnet"]    # ✅ required placeholder even if no variables to select


  observation_window: 10
  step: 1

  keysteps:
    S1: "Approach peg"
    S2: "Align & grasp"
    S3: "Lift peg"
    S4: "Transfer peg - Get together"
    S5: "Transfer peg - Exchange"
    S6: "Approach pole"
    S7: "Align & place"

learning_params:
  lr: 1.0e-5
  epochs: 30
  weight_decay: 1.0e-5
  patience: 30
  lr_drop: 20
  best_chkpoint: "./checkpoints/job_xxx/val_best_model.pt"

tcn_model_params:
  encoder_params:
    in_channels: 256
    kernel_size: 31
    out_channels: 128
  decoder_params:
    in_channels: 60
    kernel_size: 31
    out_channels: 60
  input_dim: 64
  num_classes: 8

transformer_params:
  d_model: 128
  nhead: 8
  num_layers: 2
  dropout: 0.1
  batch_first: true
  sample_rate: 48000
  n_mels: 64
  hop_length: 512
  n_fft: 1024
  resnet_dim: 2048
  seq_to_one: true


# optional overrides for build_model_cfg_from_dataloader
model_cfg_overrides:
  d_model: 128
  nhead: 4
  num_layers: 2
  dropout: 0.1
  fusion: "cross_attend"
  modality_dropout_p: 0.1


mstcn_model_params:
  features_dim: 2048
  num_f_maps: 64
  num_layers_PG: 11
  num_layers_R: 10
  num_R: 3
